name: Publish fixed-theme Test package

on:
  push:
    paths:
      - 'src/current/version.json'

permissions:
  contents: write

jobs:
  build-native-host:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build native Windows hosts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -LiteralPath "src/current/version.json" -Raw | ConvertFrom-Json).version
          $work = Join-Path $env:RUNNER_TEMP "central-fixed-host"
          if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $outDir = Join-Path $work "out"
          & ".\src\launcher\build-host.ps1" -Version $version -OutputDirectory $outDir
          & ".\src\launcher\build-updater-host.ps1" -Version $version -OutputDirectory $outDir
          $hostExe = Join-Path $outDir "Central de Trabalho.exe"
          $updaterExe = Join-Path $outDir "Central de Trabalho Updater.exe"
          if (-not (Test-Path -LiteralPath $hostExe -PathType Leaf)) { throw "Host nativo da Central não foi gerado." }
          if (-not (Test-Path -LiteralPath $updaterExe -PathType Leaf)) { throw "Host nativo do Atualizador não foi gerado." }
          Write-Host "Hosts nativos v$version gerados com sucesso."

      - name: Upload native hosts
        uses: actions/upload-artifact@v4
        with:
          name: fixed-theme-native-host
          path: |
            ${{ runner.temp }}/central-fixed-host/out/Central de Trabalho.exe
            ${{ runner.temp }}/central-fixed-host/out/Central de Trabalho Updater.exe
          if-no-files-found: error
          retention-days: 1

  build-package:
    needs: build-native-host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download native hosts
        uses: actions/download-artifact@v4
        with:
          name: fixed-theme-native-host
          path: ${{ runner.temp }}/fixed-theme-native-host

      - name: Build and audit Test candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("src/current/version.json", encoding="utf-8"))["version"])')"
          BUILD_DIR="$RUNNER_TEMP/fixed-theme-build"
          SOURCE_ROOT="src/generated"
          NATIVE_HOST="$RUNNER_TEMP/fixed-theme-native-host/Central de Trabalho.exe"
          NATIVE_UPDATER_HOST="$RUNNER_TEMP/fixed-theme-native-host/Central de Trabalho Updater.exe"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          test -f "$NATIVE_HOST"
          test -f "$NATIVE_UPDATER_HOST"

          if compgen -G "src/current/transforms/*.py" > /dev/null; then
            for transform in src/current/transforms/*.py; do
              echo "Aplicando transformação: $transform"
              python3 "$transform"
            done
          fi

          OUT_ROOT="$BUILD_DIR/Central-de-Trabalho-v${VERSION}"
          mkdir -p "$OUT_ROOT/Atualizador" \
                   "$OUT_ROOT/Modulos/Central-de-Manutencao-CB5" \
                   "$OUT_ROOT/Modulos/Gerador-de-Planilhas-CB5-TV5" \
                   "$OUT_ROOT/Modulos/Controle-NF-Entrada"

          cp "$NATIVE_HOST" "$OUT_ROOT/Central de Trabalho.exe"
          cp "$SOURCE_ROOT/Central de Trabalho.ps1" "$OUT_ROOT/"
          cp "$SOURCE_ROOT/Atualizador/CANAIS.json" "$OUT_ROOT/Atualizador/"
          cp "$NATIVE_UPDATER_HOST" "$OUT_ROOT/Atualizador/Central de Trabalho Updater.exe"
          cp "$SOURCE_ROOT/Atualizador/Central de Trabalho Updater.ps1" "$OUT_ROOT/Atualizador/"
          cp "$SOURCE_ROOT/Atualizador/Update.Core.ps1" "$OUT_ROOT/Atualizador/"
          cp "$SOURCE_ROOT/Modulos/Central-de-Manutencao-CB5/Central Manutencao CB5.ps1" "$OUT_ROOT/Modulos/Central-de-Manutencao-CB5/"
          cp "$SOURCE_ROOT/Modulos/Central-de-Manutencao-CB5/Manutencao.Core.ps1" "$OUT_ROOT/Modulos/Central-de-Manutencao-CB5/"
          cp "$SOURCE_ROOT/Modulos/Gerador-de-Planilhas-CB5-TV5/Gerador Planilhas.ps1" "$OUT_ROOT/Modulos/Gerador-de-Planilhas-CB5-TV5/"
          cp "$SOURCE_ROOT/Modulos/Gerador-de-Planilhas-CB5-TV5/Componentes.Core.ps1" "$OUT_ROOT/Modulos/Gerador-de-Planilhas-CB5-TV5/"
          cp "$SOURCE_ROOT/Modulos/Controle-NF-Entrada/Controle NF Entrada.ps1" "$OUT_ROOT/Modulos/Controle-NF-Entrada/"
          cp "$SOURCE_ROOT/Modulos/Controle-NF-Entrada/NFEntrada.Core.ps1" "$OUT_ROOT/Modulos/Controle-NF-Entrada/"

          python3 - "$OUT_ROOT" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          bom = b'\xef\xbb\xbf'
          for p in root.rglob('*.ps1'):
              raw = p.read_bytes()
              if raw.startswith(bom):
                  raw = raw[len(bom):]
              p.write_bytes(bom + raw)
          PY

          python3 src/ci/audit_release.py tree "$OUT_ROOT" "$VERSION"
          python3 src/ci/regression_contracts.py "$OUT_ROOT"
          pwsh -NoProfile -NonInteractive -File src/ci/parse_powershell.ps1 -Root "$OUT_ROOT"

          python3 - "$OUT_ROOT" "$VERSION" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          central = (root / 'Central de Trabalho.ps1').read_text(encoding='utf-8-sig')
          required = [
              '$settings.Theme = "Técnico industrial"',
              '$sidebarThemeLabel.Visible = $false',
              '$themeCombo.Visible = $false',
          ]
          for marker in required:
              if marker not in central:
                  raise SystemExit(f'Tema fixo não encontrado no pacote: {marker}')
          files = []
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name != 'PACOTE-MANIFESTO.json'):
              rel = p.relative_to(root).as_posix().replace('/', '\\')
              data = p.read_bytes()
              files.append({'Path': rel, 'Size': len(data), 'Sha256': hashlib.sha256(data).hexdigest().upper()})
          manifest = {'SchemaVersion': 1, 'AppId': 'central-de-trabalho', 'Version': version, 'Files': files}
          (root / 'PACOTE-MANIFESTO.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8-sig')
          out = pathlib.Path('updates/packages') / f'Central-de-Trabalho-v{version}.zip'
          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  z.write(p, pathlib.Path(root.name) / p.relative_to(root))
          package = out.read_bytes()
          meta = json.loads(pathlib.Path('src/current/version.json').read_text(encoding='utf-8'))
          channel = {
              'SchemaVersion': 1,
              'AppId': 'central-de-trabalho',
              'Channel': 'test',
              'Version': version,
              'MinimumUpdaterVersion': '1.0.0',
              'PackageUrl': f'https://cdn.jsdelivr.net/gh/clienteg1603/Central-de-Trabalho-CB5@main/updates/packages/Central-de-Trabalho-v{version}.zip',
              'PackageSha256': hashlib.sha256(package).hexdigest().upper(),
              'PackageSize': len(package),
              'PackageRoot': root.name,
              'ReleaseNotes': meta.get('releaseNotes', [])
          }
          pathlib.Path('updates/test.json').write_text(json.dumps(channel, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Pacote {version}: {len(package)} bytes / {channel["PackageSha256"]}')
          PY

          python3 src/ci/audit_release.py package "$OUT_ROOT" "$VERSION" \
            "updates/packages/Central-de-Trabalho-v${VERSION}.zip" \
            "updates/test.json"

          CANDIDATE_DIR="$RUNNER_TEMP/fixed-theme-candidate"
          rm -rf "$CANDIDATE_DIR"
          mkdir -p "$CANDIDATE_DIR"
          cp "updates/packages/Central-de-Trabalho-v${VERSION}.zip" "$CANDIDATE_DIR/"
          cp "updates/test.json" "$CANDIDATE_DIR/"

      - name: Upload Test candidate
        uses: actions/upload-artifact@v4
        with:
          name: fixed-theme-test-candidate
          path: ${{ runner.temp }}/fixed-theme-candidate
          if-no-files-found: error
          retention-days: 7

  validate-windows:
    needs: build-package
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout validation sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: fixed-theme-test-candidate
          path: ${{ runner.temp }}/fixed-theme-candidate

      - name: Validate real ZIP and packaged executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $version = (Get-Content -LiteralPath "src/current/version.json" -Raw | ConvertFrom-Json).version
          $candidateDir = Join-Path $env:RUNNER_TEMP "fixed-theme-candidate"
          $zipPath = Join-Path $candidateDir "Central-de-Trabalho-v$version.zip"
          $channelPath = Join-Path $candidateDir "test.json"
          $channel = Get-Content -LiteralPath $channelPath -Raw | ConvertFrom-Json
          if ((Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToUpperInvariant() -ne [string]$channel.PackageSha256) { throw "SHA-256 do candidato divergiu." }
          if (([IO.FileInfo]$zipPath).Length -ne [int64]$channel.PackageSize) { throw "Tamanho do candidato divergiu." }

          $validationRoot = Join-Path $env:RUNNER_TEMP "fixed-theme-validation"
          if (Test-Path -LiteralPath $validationRoot) { Remove-Item -LiteralPath $validationRoot -Recurse -Force }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $validationRoot -Force
          $installRoot = Join-Path $validationRoot ([string]$channel.PackageRoot)
          & ".\src\ci\parse_powershell.ps1" -Root $installRoot
          python src/ci/regression_contracts.py "$installRoot"
          python src/ci/audit_release.py tree "$installRoot" "$version"
          python src/ci/audit_release.py package "$installRoot" "$version" "$zipPath" "$channelPath"

          $nfCore = Join-Path $installRoot "Modulos\Controle-NF-Entrada\NFEntrada.Core.ps1"
          $nfUi = Join-Path $installRoot "Modulos\Controle-NF-Entrada\Controle NF Entrada.ps1"
          $centralUi = Join-Path $installRoot "Central de Trabalho.ps1"
          & ".\src\ci\test_nfentrada_final.ps1" -CorePath $nfCore -UiPath $nfUi -CentralPath $centralUi

          $centralText = [IO.File]::ReadAllText($centralUi, [Text.Encoding]::UTF8)
          if (-not $centralText.Contains('$settings.Theme = "Técnico industrial"')) { throw "Tema Técnico industrial não está fixo." }
          if (-not $centralText.Contains('$sidebarThemeLabel.Visible = $false')) { throw "Rótulo de aparência ainda visível." }
          if (-not $centralText.Contains('$themeCombo.Visible = $false')) { throw "Seletor de aparência ainda visível." }

          $hostExe = Join-Path $installRoot "Central de Trabalho.exe"
          $updaterExe = Join-Path $installRoot "Atualizador\Central de Trabalho Updater.exe"
          $hostSmoke = Start-Process -FilePath $hostExe -ArgumentList "--self-test" -WorkingDirectory $installRoot -Wait -PassThru
          if ($hostSmoke.ExitCode -ne 0) { throw "Smoke test da Central falhou: $($hostSmoke.ExitCode)." }
          $updaterSmokeArgs = '--self-test -InstallRoot "' + $installRoot + '"'
          $updaterSmoke = Start-Process -FilePath $updaterExe -ArgumentList $updaterSmokeArgs -WorkingDirectory (Split-Path -Parent $updaterExe) -Wait -PassThru
          if ($updaterSmoke.ExitCode -ne 0) { throw "Smoke test do Atualizador falhou: $($updaterSmoke.ExitCode)." }
          Write-Host "VALIDAÇÃO FIXED THEME: OK - ZIP real, Técnico industrial fixo e executáveis empacotados validados."

  publish-test:
    needs: validate-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated candidate
        uses: actions/download-artifact@v4
        with:
          name: fixed-theme-test-candidate
          path: ${{ runner.temp }}/fixed-theme-candidate

      - name: Publish only to Test
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("src/current/version.json", encoding="utf-8"))["version"])')"
          STABLE_VERSION="$(python3 -c 'import json; print(json.load(open("updates/stable.json", encoding="utf-8"))["Version"])')"
          test "$STABLE_VERSION" = "0.20.2"
          CANDIDATE_DIR="$RUNNER_TEMP/fixed-theme-candidate"
          CANDIDATE_ZIP="$CANDIDATE_DIR/Central-de-Trabalho-v${VERSION}.zip"
          CANDIDATE_JSON="$CANDIDATE_DIR/test.json"
          test -s "$CANDIDATE_ZIP"
          test -s "$CANDIDATE_JSON"

          STABLE_JSON_HASH="$(sha256sum updates/stable.json | awk '{print $1}')"
          STABLE_PACKAGE="updates/packages/Central-de-Trabalho-v${STABLE_VERSION}.zip"
          test -s "$STABLE_PACKAGE"
          STABLE_PACKAGE_HASH="$(sha256sum "$STABLE_PACKAGE" | awk '{print $1}')"

          for package in updates/packages/Central-de-Trabalho-v*.zip; do
            [ -e "$package" ] || continue
            name="$(basename "$package")"
            if [ "$name" != "Central-de-Trabalho-v${STABLE_VERSION}.zip" ] && [ "$name" != "Central-de-Trabalho-v${VERSION}.zip" ]; then
              rm -f "$package"
            fi
          done

          cp "$CANDIDATE_ZIP" "updates/packages/Central-de-Trabalho-v${VERSION}.zip"
          cp "$CANDIDATE_JSON" "updates/test.json"
          test "$(sha256sum updates/stable.json | awk '{print $1}')" = "$STABLE_JSON_HASH"
          test "$(sha256sum "$STABLE_PACKAGE" | awk '{print $1}')" = "$STABLE_PACKAGE_HASH"
          test "$(python3 -c 'import json; print(json.load(open("updates/test.json", encoding="utf-8"))["Version"])')" = "$VERSION"

          git config user.name "Central de Trabalho Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A updates/packages updates/test.json
          if ! git diff --quiet -- updates/stable.json; then
            echo "ERRO: canal Estável foi alterado."
            exit 1
          fi
          git commit -m "Publica Central de Trabalho v${VERSION} no canal Teste"
          git push
