name: NF Entrada stage 1 evolve temporary

on:
  push:
    paths:
      - 'src/current/NFENTRADA_STAGE1_READY'

permissions:
  contents: write

jobs:
  evolve:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar evolução da etapa 1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python ".\src\current\transforms\0212_nfentrada_stage1.py"

      - name: Validar importação, histórico, backup e sintaxe no Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & ".\src\ci\test_nfentrada_import.ps1" -CorePath ".\src\generated\Modulos\Controle-NF-Entrada\NFEntrada.Core.ps1"
          & ".\src\ci\test_nfentrada_stage1.ps1" -CorePath ".\src\generated\Modulos\Controle-NF-Entrada\NFEntrada.Core.ps1"
          & ".\src\ci\parse_powershell.ps1" -Root ".\src\generated"
          python ".\src\ci\regression_contracts.py" ".\src\generated"

      - name: Publicar fontes validados e disparar build Teste
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -LiteralPath "src/current/NFENTRADA_STAGE1_READY" -Force
          Remove-Item -LiteralPath "src/current/transforms/0212_nfentrada_stage1.py" -Force
          git config user.name "Central de Trabalho Builder"
          git config user.email "actions@users.noreply.github.com"
          git add 'src/generated/Modulos/Controle-NF-Entrada/NFEntrada.Core.ps1'
          git add 'src/generated/Modulos/Controle-NF-Entrada/Controle NF Entrada.ps1'
          git add 'src/generated/Central de Trabalho.ps1'
          git add 'src/ci/regression_contracts.py'
          git add 'src/ci/test_nfentrada_stage1.ps1'
          git add 'src/current/version.json'
          git add -u 'src/current/NFENTRADA_STAGE1_READY'
          git add -u 'src/current/transforms/0212_nfentrada_stage1.py'
          git commit -m "Evolui Controle NF Entrada - etapa 1 operacional"
          git push
