name: NF Entrada stage 11 evolve temporary

on:
  push:
    branches:
      - stage11-retry
    paths:
      - 'src/current/NFENTRADA_STAGE11_READY'

permissions:
  contents: write

jobs:
  evolve:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar evolução da etapa 11
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python ".\src\current\transforms\0214_nfentrada_stage11.py"

      - name: Validar toda a cadeia do Controle NF Entrada
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $core = ".\src\generated\Modulos\Controle-NF-Entrada\NFEntrada.Core.ps1"
          $ui = ".\src\generated\Modulos\Controle-NF-Entrada\Controle NF Entrada.ps1"
          & ".\src\ci\test_nfentrada_import.ps1" -CorePath $core
          & ".\src\ci\test_nfentrada_stage1.ps1" -CorePath $core
          & ".\src\ci\test_nfentrada_stage2.ps1" -CorePath $core
          & ".\src\ci\test_nfentrada_stage3.ps1" -CorePath $core
          & ".\src\ci\test_nfentrada_stage5.ps1" -CorePath $core
          & ".\src\ci\test_nfentrada_stage6.ps1" -CorePath $core
          & ".\src\ci\test_nfentrada_stage7.ps1" -CorePath $core -UiPath $ui
          & ".\src\ci\test_nfentrada_stage8.ps1" -CorePath $core -UiPath $ui
          & ".\src\ci\test_nfentrada_stage9.ps1" -CorePath $core
          & ".\src\ci\test_nfentrada_stage11.ps1" -CorePath $core -UiPath $ui
          & ".\src\ci\parse_powershell.ps1" -Root ".\src\generated"
          python ".\src\ci\regression_contracts.py" ".\src\generated"

      - name: Publicar fontes validados na branch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -LiteralPath "src/current/NFENTRADA_STAGE11_READY" -Force
          Remove-Item -LiteralPath "src/current/STAGE11_WRITE_TEST" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "src/current/transforms/0214_nfentrada_stage11.py" -Force
          Remove-Item -LiteralPath ".github/workflows/nfentrada-stage11-evolve-temporary.yml" -Force
          git config user.name "Central de Trabalho Builder"
          git config user.email "actions@users.noreply.github.com"
          git add 'src/generated/Modulos/Controle-NF-Entrada/NFEntrada.Core.ps1'
          git add 'src/generated/Modulos/Controle-NF-Entrada/Controle NF Entrada.ps1'
          git add 'src/generated/Central de Trabalho.ps1'
          git add 'src/ci/test_nfentrada_stage11.ps1'
          git add -u 'src/current'
          git add -u '.github/workflows'
          git commit -m "Evolui Controle NF Entrada - etapa 11 auditoria final"
          git push origin HEAD:stage11-retry
