name: Prepare NF Entrada temporary

on:
  push:
    paths:
      - 'src/current/NFENTRADA_PREPARE_READY'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply permanent NF Entrada infrastructure changes
        shell: bash
        run: |
          set -euo pipefail
          python3 src/current/prepare_nfentrada_v0210.py
          python3 -m py_compile src/ci/audit_release.py src/ci/release_readiness.py src/ci/regression_contracts.py
          rm -f src/current/prepare_nfentrada_v0210.py src/current/NFENTRADA_PREPARE_READY
          rm -f .github/workflows/assemble-nfentrada-temporary.yml
          git config user.name "Central de Trabalho Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A .github/workflows src/ci src/launcher src/current
          git commit -m "Prepara infraestrutura para o módulo Controle de NF de Entrada"
          git push
