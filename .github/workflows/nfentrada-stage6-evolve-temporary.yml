name: NF Entrada stage 6 evolve temporary

on:
  push:
    paths:
      - 'src/current/NFENTRADA_STAGE6_READY'

permissions:
  contents: write

jobs:
  evolve:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar evolução da etapa 6
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git apply --check --unidiff-zero "src/current/patches/0218_nfentrada_stage6.patch"
          git apply --unidiff-zero "src/current/patches/0218_nfentrada_stage6.patch"

      - name: Validar resumo operacional e conferência
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & ".\src\ci\test_nfentrada_stage6.ps1" -CorePath ".\src\generated\Modulos\Controle-NF-Entrada\NFEntrada.Core.ps1"
          & ".\src\ci\test_nfentrada_stage5.ps1" -CorePath ".\src\generated\Modulos\Controle-NF-Entrada\NFEntrada.Core.ps1"
          & ".\src\ci\parse_powershell.ps1" -Root ".\src\generated"
          python ".\src\ci\regression_contracts.py" ".\src\generated"

      - name: Publicar fontes validados e disparar build Teste
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -LiteralPath "src/current/NFENTRADA_STAGE6_READY" -Force
          Remove-Item -LiteralPath "src/current/patches/0218_nfentrada_stage6.patch" -Force
          if (Test-Path -LiteralPath "src/current/patches/0218_probe.patch") { Remove-Item -LiteralPath "src/current/patches/0218_probe.patch" -Force }
          if (Test-Path -LiteralPath "src/current/transforms/test_stage6.txt") { Remove-Item -LiteralPath "src/current/transforms/test_stage6.txt" -Force }
          if (Test-Path -LiteralPath ".github/workflows/nfentrada-stage5-evolve-temporary.yml") { Remove-Item -LiteralPath ".github/workflows/nfentrada-stage5-evolve-temporary.yml" -Force }
          Remove-Item -LiteralPath ".github/workflows/nfentrada-stage6-evolve-temporary.yml" -Force
          git config user.name "Central de Trabalho Builder"
          git config user.email "actions@users.noreply.github.com"
          git add 'src/generated/Modulos/Controle-NF-Entrada/NFEntrada.Core.ps1'
          git add 'src/generated/Modulos/Controle-NF-Entrada/Controle NF Entrada.ps1'
          git add 'src/generated/Central de Trabalho.ps1'
          git add 'src/ci/regression_contracts.py'
          git add 'src/ci/test_nfentrada_stage6.ps1'
          git add 'src/current/version.json'
          git add -u 'src/current'
          git add -u '.github/workflows'
          git commit -m "Evolui Controle NF Entrada - etapa 6 operacional"
          git push
