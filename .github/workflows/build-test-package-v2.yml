name: Build test package v2

on:
  push:
    paths:
      - 'src/current/version.json'

permissions:
  contents: write

jobs:
  build-native-host:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and smoke-test native Windows hosts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -LiteralPath "src/current/version.json" -Raw | ConvertFrom-Json).version
          $work = Join-Path $env:RUNNER_TEMP "central-native-host"
          if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          $outDir = Join-Path $work "out"
          & ".\src\launcher\build-host.ps1" -Version $version -OutputDirectory $outDir
          & ".\src\launcher\build-updater-host.ps1" -Version $version -OutputDirectory $outDir

          $hostExe = Join-Path $outDir "Central de Trabalho.exe"
          $updaterExe = Join-Path $outDir "Central de Trabalho Updater.exe"
          if (-not (Test-Path -LiteralPath $hostExe -PathType Leaf)) { throw "Host nativo da Central não foi gerado." }
          if (-not (Test-Path -LiteralPath $updaterExe -PathType Leaf)) { throw "Host nativo do Atualizador não foi gerado." }

          # Monta uma instalação temporária completa e executa o autoteste silencioso.
          $smokeRoot = Join-Path $work "smoke\Central-de-Trabalho"
          $smokeUpdater = Join-Path $smokeRoot "Atualizador"
          $smokeMaintenance = Join-Path $smokeRoot "Modulos\Central-de-Manutencao-CB5"
          $smokeGenerator = Join-Path $smokeRoot "Modulos\Gerador-de-Planilhas-CB5-TV5"
          $smokeNFEntrada = Join-Path $smokeRoot "Modulos\Controle-NF-Entrada"
          New-Item -ItemType Directory -Force -Path $smokeUpdater, $smokeMaintenance, $smokeGenerator, $smokeNFEntrada | Out-Null

          Copy-Item -LiteralPath $hostExe -Destination (Join-Path $smokeRoot "Central de Trabalho.exe") -Force
          Copy-Item -LiteralPath $updaterExe -Destination (Join-Path $smokeUpdater "Central de Trabalho Updater.exe") -Force
          Copy-Item -LiteralPath "src\generated\Central de Trabalho.ps1" -Destination $smokeRoot -Force
          Copy-Item -LiteralPath "src\generated\Atualizador\CANAIS.json" -Destination $smokeUpdater -Force
          Copy-Item -LiteralPath "src\generated\Atualizador\Central de Trabalho Updater.ps1" -Destination $smokeUpdater -Force
          Copy-Item -LiteralPath "src\generated\Atualizador\Update.Core.ps1" -Destination $smokeUpdater -Force
          Copy-Item -LiteralPath "src\generated\Modulos\Central-de-Manutencao-CB5\Central Manutencao CB5.ps1" -Destination $smokeMaintenance -Force
          Copy-Item -LiteralPath "src\generated\Modulos\Central-de-Manutencao-CB5\Manutencao.Core.ps1" -Destination $smokeMaintenance -Force
          Copy-Item -LiteralPath "src\generated\Modulos\Gerador-de-Planilhas-CB5-TV5\Gerador Planilhas.ps1" -Destination $smokeGenerator -Force
          Copy-Item -LiteralPath "src\generated\Modulos\Gerador-de-Planilhas-CB5-TV5\Componentes.Core.ps1" -Destination $smokeGenerator -Force
          Copy-Item -LiteralPath "src\generated\Modulos\Controle-NF-Entrada\Controle NF Entrada.ps1" -Destination $smokeNFEntrada -Force
          Copy-Item -LiteralPath "src\generated\Modulos\Controle-NF-Entrada\NFEntrada.Core.ps1" -Destination $smokeNFEntrada -Force

          $centralSmoke = Start-Process -FilePath (Join-Path $smokeRoot "Central de Trabalho.exe") -ArgumentList "--self-test" -WorkingDirectory $smokeRoot -Wait -PassThru
          if ($centralSmoke.ExitCode -ne 0) { throw "Autoteste da Central falhou com código $($centralSmoke.ExitCode)." }

          $updaterSmoke = Start-Process -FilePath (Join-Path $smokeUpdater "Central de Trabalho Updater.exe") -ArgumentList "--self-test", "-InstallRoot", ('"' + $smokeRoot + '"') -WorkingDirectory $smokeUpdater -Wait -PassThru
          if ($updaterSmoke.ExitCode -ne 0) { throw "Autoteste do Atualizador falhou com código $($updaterSmoke.ExitCode)." }

          Write-Host "SMOKE TEST NATIVO: OK - Central e Atualizador validaram arquivos, scripts e engine PowerShell em processo."
          Write-Host "Hosts nativos prontos com identidade visual CT:"
          Write-Host "  $hostExe"
          Write-Host "  $updaterExe"

      - name: Upload native hosts
        uses: actions/upload-artifact@v4
        with:
          name: central-native-host
          path: |
            ${{ runner.temp }}/central-native-host/out/Central de Trabalho.exe
            ${{ runner.temp }}/central-native-host/out/Central de Trabalho Updater.exe
          if-no-files-found: error
          retention-days: 1

  build-test-package:
    needs: build-native-host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download native hosts
        uses: actions/download-artifact@v4
        with:
          name: central-native-host
          path: ${{ runner.temp }}/central-native-host

      - name: Build clean package from versioned source
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("src/current/version.json", encoding="utf-8"))["version"])')"
          BUILD_DIR="$RUNNER_TEMP/central-build"
          SOURCE_ROOT="src/generated"
          NATIVE_HOST="$RUNNER_TEMP/central-native-host/Central de Trabalho.exe"
          NATIVE_UPDATER_HOST="$RUNNER_TEMP/central-native-host/Central de Trabalho Updater.exe"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          test -f "$NATIVE_HOST"
          test -f "$NATIVE_UPDATER_HOST"

          required_sources=(
            "$SOURCE_ROOT/Central de Trabalho.ps1"
            "$SOURCE_ROOT/Atualizador/CANAIS.json"
            "$SOURCE_ROOT/Atualizador/Central de Trabalho Updater.ps1"
            "$SOURCE_ROOT/Atualizador/Update.Core.ps1"
            "$SOURCE_ROOT/Modulos/Central-de-Manutencao-CB5/Central Manutencao CB5.ps1"
            "$SOURCE_ROOT/Modulos/Central-de-Manutencao-CB5/Manutencao.Core.ps1"
            "$SOURCE_ROOT/Modulos/Gerador-de-Planilhas-CB5-TV5/Gerador Planilhas.ps1"
            "$SOURCE_ROOT/Modulos/Gerador-de-Planilhas-CB5-TV5/Componentes.Core.ps1"
            "$SOURCE_ROOT/Modulos/Controle-NF-Entrada/Controle NF Entrada.ps1"
            "$SOURCE_ROOT/Modulos/Controle-NF-Entrada/NFEntrada.Core.ps1"
          )
          for source in "${required_sources[@]}"; do
            test -s "$source" || { echo "ERRO: fonte runtime ausente ou vazio: $source"; exit 1; }
          done

          if compgen -G "src/current/transforms/*.py" > /dev/null; then
            for transform in src/current/transforms/*.py; do
              echo "Aplicando transformação: $transform"
              python3 "$transform"
            done
            rm -f src/current/transforms/*.py
          fi

          OUT_ROOT="$BUILD_DIR/Central-de-Trabalho-v${VERSION}"
          mkdir -p "$OUT_ROOT/Atualizador" \
                   "$OUT_ROOT/Modulos/Central-de-Manutencao-CB5" \
                   "$OUT_ROOT/Modulos/Gerador-de-Planilhas-CB5-TV5" \
                   "$OUT_ROOT/Modulos/Controle-NF-Entrada"

          cp "$NATIVE_HOST" "$OUT_ROOT/Central de Trabalho.exe"
          cp "$SOURCE_ROOT/Central de Trabalho.ps1" "$OUT_ROOT/"
          cp "$SOURCE_ROOT/Atualizador/CANAIS.json" "$OUT_ROOT/Atualizador/"
          cp "$NATIVE_UPDATER_HOST" "$OUT_ROOT/Atualizador/Central de Trabalho Updater.exe"
          cp "$SOURCE_ROOT/Atualizador/Central de Trabalho Updater.ps1" "$OUT_ROOT/Atualizador/"
          cp "$SOURCE_ROOT/Atualizador/Update.Core.ps1" "$OUT_ROOT/Atualizador/"
          cp "$SOURCE_ROOT/Modulos/Central-de-Manutencao-CB5/Central Manutencao CB5.ps1" "$OUT_ROOT/Modulos/Central-de-Manutencao-CB5/"
          cp "$SOURCE_ROOT/Modulos/Central-de-Manutencao-CB5/Manutencao.Core.ps1" "$OUT_ROOT/Modulos/Central-de-Manutencao-CB5/"
          cp "$SOURCE_ROOT/Modulos/Gerador-de-Planilhas-CB5-TV5/Gerador Planilhas.ps1" "$OUT_ROOT/Modulos/Gerador-de-Planilhas-CB5-TV5/"
          cp "$SOURCE_ROOT/Modulos/Gerador-de-Planilhas-CB5-TV5/Componentes.Core.ps1" "$OUT_ROOT/Modulos/Gerador-de-Planilhas-CB5-TV5/"
          cp "$SOURCE_ROOT/Modulos/Controle-NF-Entrada/Controle NF Entrada.ps1" "$OUT_ROOT/Modulos/Controle-NF-Entrada/"
          cp "$SOURCE_ROOT/Modulos/Controle-NF-Entrada/NFEntrada.Core.ps1" "$OUT_ROOT/Modulos/Controle-NF-Entrada/"

          python3 - "$OUT_ROOT" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          paths = [
              root / 'Central de Trabalho.ps1',
              root / 'Atualizador/Central de Trabalho Updater.ps1',
              root / 'Atualizador/Update.Core.ps1',
              root / 'Modulos/Central-de-Manutencao-CB5/Central Manutencao CB5.ps1',
              root / 'Modulos/Central-de-Manutencao-CB5/Manutencao.Core.ps1',
              root / 'Modulos/Gerador-de-Planilhas-CB5-TV5/Gerador Planilhas.ps1',
              root / 'Modulos/Gerador-de-Planilhas-CB5-TV5/Componentes.Core.ps1',
              root / 'Modulos/Controle-NF-Entrada/Controle NF Entrada.ps1',
              root / 'Modulos/Controle-NF-Entrada/NFEntrada.Core.ps1',
          ]
          bom = b'\xef\xbb\xbf'
          for p in paths:
              raw = p.read_bytes()
              if raw.startswith(bom):
                  raw = raw[len(bom):]
              p.write_bytes(bom + raw)
          PY

          if find "$OUT_ROOT" -type f \( -iname '*.vbs' -o -iname '*.bat' -o -iname '*.cmd' \) | grep -q .; then
            echo "ERRO: lançador/script legado encontrado no pacote limpo."
            find "$OUT_ROOT" -type f \( -iname '*.vbs' -o -iname '*.bat' -o -iname '*.cmd' \) -print
            exit 1
          fi

          python3 src/ci/audit_release.py tree "$OUT_ROOT" "$VERSION"
          python3 src/ci/regression_contracts.py "$OUT_ROOT"
          pwsh -NoProfile -NonInteractive -File src/ci/parse_powershell.ps1 -Root "$OUT_ROOT"

          python3 - "$OUT_ROOT" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          central = (root / 'Central de Trabalho.ps1').read_text(encoding='utf-8-sig').lower()
          if 'powershell.exe' in central or 'pwsh.exe' in central:
              raise SystemExit('Central voltou a referenciar um executável PowerShell externo.')
          updater = (root / 'Atualizador/Central de Trabalho Updater.exe').read_bytes().lower()
          forbidden = [b'powershell.exe', 'powershell.exe'.encode('utf-16le'), b'pwsh.exe', 'pwsh.exe'.encode('utf-16le')]
          if any(marker in updater for marker in forbidden):
              raise SystemExit('Atualizador empacotado ainda contém lançador para PowerShell externo.')
          print('HOSTS NATIVOS: OK — Central e Atualizador sem lançador PowerShell externo.')
          PY

          python3 - "$OUT_ROOT" "$VERSION" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          files = []
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name != 'PACOTE-MANIFESTO.json'):
              rel = p.relative_to(root).as_posix().replace('/', '\\')
              data = p.read_bytes()
              files.append({'Path': rel, 'Size': len(data), 'Sha256': hashlib.sha256(data).hexdigest().upper()})
          manifest = {'SchemaVersion': 1, 'AppId': 'central-de-trabalho', 'Version': version, 'Files': files}
          (root / 'PACOTE-MANIFESTO.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8-sig')

          out = pathlib.Path('updates/packages') / f'Central-de-Trabalho-v{version}.zip'
          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  z.write(p, pathlib.Path(root.name) / p.relative_to(root))

          package = out.read_bytes()
          meta = json.loads(pathlib.Path('src/current/version.json').read_text(encoding='utf-8'))
          channel = {
              'SchemaVersion': 1,
              'AppId': 'central-de-trabalho',
              'Channel': 'test',
              'Version': version,
              'MinimumUpdaterVersion': '1.0.0',
              'PackageUrl': f'https://cdn.jsdelivr.net/gh/clienteg1603/Central-de-Trabalho-CB5@main/updates/packages/Central-de-Trabalho-v{version}.zip',
              'PackageSha256': hashlib.sha256(package).hexdigest().upper(),
              'PackageSize': len(package),
              'PackageRoot': root.name,
              'ReleaseNotes': meta.get('releaseNotes', [])
          }
          pathlib.Path('updates/test.json').write_text(json.dumps(channel, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Pacote {version}: {len(package)} bytes / {channel["PackageSha256"]}')
          PY

          python3 src/ci/audit_release.py package "$OUT_ROOT" "$VERSION" \
            "updates/packages/Central-de-Trabalho-v${VERSION}.zip" \
            "updates/test.json"

      - name: Stage candidate after static package validation
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("src/current/version.json", encoding="utf-8"))["version"])')"
          CANDIDATE_DIR="$RUNNER_TEMP/central-test-candidate"
          rm -rf "$CANDIDATE_DIR"
          mkdir -p "$CANDIDATE_DIR"
          cp "updates/packages/Central-de-Trabalho-v${VERSION}.zip" "$CANDIDATE_DIR/"
          cp "updates/test.json" "$CANDIDATE_DIR/"

      - name: Upload unpublished test candidate
        uses: actions/upload-artifact@v4
        with:
          name: central-test-candidate
          path: ${{ runner.temp }}/central-test-candidate
          if-no-files-found: error
          retention-days: 7

  validate-test-package-windows:
    needs: build-test-package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download unpublished candidate
        uses: actions/download-artifact@v4
        with:
          name: central-test-candidate
          path: ${{ runner.temp }}/central-test-candidate

      - name: Validate the real ZIP and run the packaged Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $version = (Get-Content -LiteralPath "src/current/version.json" -Raw | ConvertFrom-Json).version
          $candidateDir = Join-Path $env:RUNNER_TEMP "central-test-candidate"
          $zipPath = Join-Path $candidateDir "Central-de-Trabalho-v$version.zip"
          $channelPath = Join-Path $candidateDir "test.json"
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) { throw "ZIP candidato ausente: $zipPath" }
          if (-not (Test-Path -LiteralPath $channelPath -PathType Leaf)) { throw "Metadados candidatos ausentes: $channelPath" }

          $channel = Get-Content -LiteralPath $channelPath -Raw | ConvertFrom-Json
          $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToUpperInvariant()
          $actualSize = ([IO.FileInfo]$zipPath).Length
          if ([string]$channel.Version -ne $version) { throw "Versão divergente no test.json candidato." }
          if ([string]$channel.PackageSha256 -ne $actualHash) { throw "SHA-256 divergente no ZIP candidato." }
          if ([int64]$channel.PackageSize -ne $actualSize) { throw "Tamanho divergente no ZIP candidato." }

          $validationRoot = Join-Path $env:RUNNER_TEMP "central-package-validation"
          if (Test-Path -LiteralPath $validationRoot) { Remove-Item -LiteralPath $validationRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $validationRoot | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $validationRoot -Force
          $installRoot = Join-Path $validationRoot ([string]$channel.PackageRoot)
          if (-not (Test-Path -LiteralPath $installRoot -PathType Container)) { throw "Raiz declarada não existe dentro do ZIP." }

          & ".\src\ci\parse_powershell.ps1" -Root $installRoot
          python src/ci/regression_contracts.py "$installRoot"
          python src/ci/audit_release.py tree "$installRoot" "$version"
          python src/ci/audit_release.py package "$installRoot" "$version" "$zipPath" "$channelPath"

          $nfCore = Join-Path $installRoot "Modulos\Controle-NF-Entrada\NFEntrada.Core.ps1"
          $nfUi = Join-Path $installRoot "Modulos\Controle-NF-Entrada\Controle NF Entrada.ps1"
          $centralUi = Join-Path $installRoot "Central de Trabalho.ps1"
          & ".\src\ci\test_nfentrada_import.ps1" -CorePath $nfCore
          & ".\src\ci\test_nfentrada_stage1.ps1" -CorePath $nfCore
          & ".\src\ci\test_nfentrada_stage2.ps1" -CorePath $nfCore
          & ".\src\ci\test_nfentrada_stage3.ps1" -CorePath $nfCore
          & ".\src\ci\test_nfentrada_stage5.ps1" -CorePath $nfCore
          & ".\src\ci\test_nfentrada_stage6.ps1" -CorePath $nfCore
          & ".\src\ci\test_nfentrada_stage9.ps1" -CorePath $nfCore
          & ".\src\ci\test_nfentrada_final.ps1" -CorePath $nfCore -UiPath $nfUi -CentralPath $centralUi

          $hostExe = Join-Path $installRoot "Central de Trabalho.exe"
          $updaterExe = Join-Path $installRoot "Atualizador\Central de Trabalho Updater.exe"
          $hostSmoke = Start-Process -FilePath $hostExe -ArgumentList "--self-test" -WorkingDirectory $installRoot -Wait -PassThru
          if ($hostSmoke.ExitCode -ne 0) { throw "Smoke test do host empacotado falhou: $($hostSmoke.ExitCode)." }
          $updaterSmokeArgs = '--self-test -InstallRoot "' + $installRoot + '"'
          $updaterSmoke = Start-Process -FilePath $updaterExe -ArgumentList $updaterSmokeArgs -WorkingDirectory (Split-Path -Parent $updaterExe) -Wait -PassThru
          if ($updaterSmoke.ExitCode -ne 0) { throw "Smoke test do Atualizador empacotado falhou: $($updaterSmoke.ExitCode)." }

          $dataRoot = Join-Path $env:RUNNER_TEMP "central-theme-isolated-data"
          if (Test-Path -LiteralPath $dataRoot) { Remove-Item -LiteralPath $dataRoot -Recurse -Force }
          $centralSettings = Join-Path $dataRoot "CentralDeTrabalho"
          $generatorSettings = Join-Path $dataRoot "GeradorPlanilhasCB5TV5"
          $maintenanceSettings = Join-Path $centralSettings "ManutencaoCB5"
          New-Item -ItemType Directory -Force -Path $centralSettings, $generatorSettings, $maintenanceSettings | Out-Null
          @{ Theme = "Escuro profissional" } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $centralSettings "preferencias.json") -Encoding UTF8
          @{ Theme = "Escuro grafite"; Product = "CB5"; LastInputDirectory = "" } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $generatorSettings "preferencias.json") -Encoding UTF8
          @{ Theme = "Escuro grafite" } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $maintenanceSettings "preferencias.json") -Encoding UTF8
          $env:CENTRAL_THEME_RUNTIME_TEST = "1"
          $env:CENTRAL_THEME_TEST_DATA_ROOT = $dataRoot

          & ".\src\ci\test_hosted_theme_runtime.ps1" -GeneratedRoot $installRoot

          function Invoke-PackagedThemeRuntime {
              param([string]$RunName)
              $runRoot = Join-Path $env:RUNNER_TEMP ("theme-runtime-" + $RunName)
              $shots = Join-Path $runRoot "screenshots"
              $report = Join-Path $runRoot "report.json"
              New-Item -ItemType Directory -Force -Path $shots | Out-Null
              $arguments = '--theme-runtime-self-test --theme-runtime-report "' + $report + '" --theme-runtime-artifacts "' + $shots + '"'
              $process = Start-Process -FilePath $hostExe -ArgumentList $arguments -WorkingDirectory $installRoot -PassThru
              if (-not $process.WaitForExit(300000)) {
                  try { Stop-Process -Id $process.Id -Force } catch {}
                  throw "O host nativo bloqueou por mais de cinco minutos no teste $RunName."
              }
              $process.Refresh()
              if ($process.ExitCode -ne 0) {
                  if (Test-Path -LiteralPath $report) { Write-Host (Get-Content -LiteralPath $report -Raw) }
                  throw "O host nativo retornou $($process.ExitCode) no teste $RunName."
              }
              if (-not (Test-Path -LiteralPath $report -PathType Leaf)) { throw "Relatório ausente no teste $RunName." }
              $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
              if (-not [bool]$result.Success) { throw "O teste $RunName reportou falha: $($result.Failure)" }
              if ([int]$result.ThemeTransactionFailures -ne 0) { throw "O teste $RunName registrou falha intermediária de sincronização." }
              if ([string]$result.NativeHostProcess -ne "Central de Trabalho.exe") { throw "O teste $RunName não foi executado pelo EXE empacotado." }
              if (@($result.Cases).Count -lt 27) { throw "O teste $RunName não cobriu todos os cenários obrigatórios." }
              if (@($result.Cases | Where-Object { -not [bool]$_.Valid }).Count -gt 0) { throw "O teste $RunName contém auditoria visual inválida." }
              if (@($result.DataIntegrity).Count -lt 4 -or @($result.DataIntegrity | Where-Object { -not [bool]$_.Unchanged }).Count -gt 0) {
                  throw "O teste $RunName não comprovou a integridade dos dados operacionais."
              }

              Add-Type -AssemblyName System.Drawing
              $pngs = @(Get-ChildItem -LiteralPath $shots -Filter "*.png" -File)
              if ($pngs.Count -lt 16) { throw "O teste $RunName gerou somente $($pngs.Count) capturas visuais." }
              foreach ($png in $pngs) {
                  if ($png.Length -lt 1500) { throw "Captura visual vazia ou inválida: $($png.Name)" }
                  $bitmap = [Drawing.Bitmap]::FromFile($png.FullName)
                  try {
                      if ($bitmap.Width -lt 1000 -or $bitmap.Height -lt 650) { throw "Captura visual com dimensão insuficiente: $($png.Name)" }
                      $colors = New-Object 'Collections.Generic.HashSet[int]'
                      for ($x = 0; $x -lt $bitmap.Width; $x += 80) {
                          for ($y = 0; $y -lt $bitmap.Height; $y += 60) { [void]$colors.Add($bitmap.GetPixel($x, $y).ToArgb()) }
                      }
                      if ($colors.Count -lt 4) { throw "Captura visual aparentemente uniforme: $($png.Name)" }
                  }
                  finally { $bitmap.Dispose() }
              }
              return [pscustomobject]@{ Result = $result; Root = $runRoot }
          }

          $first = Invoke-PackagedThemeRuntime "first-start"
          if ([string]$first.Result.StartupTheme -ne "Escuro profissional") { throw "O primeiro processo não carregou a preferência inicial esperada." }
          if ([string]$first.Result.FinalTheme -ne "Claro corporativo") { throw "O primeiro processo não persistiu o tema final esperado." }
          if ([string]$first.Result.StandalonePreferences.GeneratorAfter -ne "Escuro grafite") { throw "A preferência standalone do Gerenciador foi sobrescrita." }
          if ([string]$first.Result.StandalonePreferences.MaintenanceAfter -ne "Escuro grafite") { throw "A preferência standalone da Manutenção foi sobrescrita." }

          $second = Invoke-PackagedThemeRuntime "complete-restart"
          if ([string]$second.Result.StartupTheme -ne "Claro corporativo") { throw "O segundo processo não nasceu com o tema persistido pela Central." }
          if ([string]$second.Result.FinalTheme -ne "Claro corporativo") { throw "O segundo processo terminou em tema inesperado." }

          $evidenceRoot = Join-Path $env:RUNNER_TEMP "central-theme-evidence"
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          Copy-Item -LiteralPath $first.Root -Destination (Join-Path $evidenceRoot "first-start") -Recurse -Force
          Copy-Item -LiteralPath $second.Root -Destination (Join-Path $evidenceRoot "complete-restart") -Recurse -Force
          Copy-Item -LiteralPath $channelPath -Destination (Join-Path $evidenceRoot "candidate-test.json") -Force
          Write-Host "PACOTE WINDOWS REAL: OK — executável nativo validado em dois processos completos, com capturas e propriedades reais."

      - name: Upload visual and runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: central-theme-runtime-evidence
          path: ${{ runner.temp }}/central-theme-evidence
          if-no-files-found: error
          retention-days: 30

  publish-test-package:
    needs: validate-test-package-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated candidate
        uses: actions/download-artifact@v4
        with:
          name: central-test-candidate
          path: ${{ runner.temp }}/central-test-candidate

      - name: Publish only the validated Test candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("src/current/version.json", encoding="utf-8"))["version"])')"
          STABLE_VERSION="$(python3 -c 'import json; print(json.load(open("updates/stable.json", encoding="utf-8"))["Version"])')"
          test "$STABLE_VERSION" = "0.20.2"
          CANDIDATE_DIR="$RUNNER_TEMP/central-test-candidate"
          CANDIDATE_ZIP="$CANDIDATE_DIR/Central-de-Trabalho-v${VERSION}.zip"
          CANDIDATE_JSON="$CANDIDATE_DIR/test.json"
          test -s "$CANDIDATE_ZIP"
          test -s "$CANDIDATE_JSON"

          STABLE_JSON_HASH="$(sha256sum updates/stable.json | awk '{print $1}')"
          STABLE_PACKAGE="updates/packages/Central-de-Trabalho-v${STABLE_VERSION}.zip"
          test -s "$STABLE_PACKAGE"
          STABLE_PACKAGE_HASH="$(sha256sum "$STABLE_PACKAGE" | awk '{print $1}')"

          for package in updates/packages/Central-de-Trabalho-v*.zip; do
            [ -e "$package" ] || continue
            name="$(basename "$package")"
            if [ "$name" != "Central-de-Trabalho-v${STABLE_VERSION}.zip" ] && [ "$name" != "Central-de-Trabalho-v${VERSION}.zip" ]; then
              rm -f "$package"
            fi
          done

          cp "$CANDIDATE_ZIP" "updates/packages/Central-de-Trabalho-v${VERSION}.zip"
          cp "$CANDIDATE_JSON" "updates/test.json"
          test "$(sha256sum updates/stable.json | awk '{print $1}')" = "$STABLE_JSON_HASH"
          test "$(sha256sum "$STABLE_PACKAGE" | awk '{print $1}')" = "$STABLE_PACKAGE_HASH"
          test "$(python3 -c 'import json; print(json.load(open("updates/test.json", encoding="utf-8"))["Version"])')" = "$VERSION"

          git config user.name "Central de Trabalho Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A updates/packages updates/test.json
          if ! git diff --quiet -- updates/stable.json; then
            echo "ERRO: o canal Estável foi alterado."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
            exit 0
          fi
          git commit -m "Publica Central de Trabalho v${VERSION} no canal Teste"
          git push
