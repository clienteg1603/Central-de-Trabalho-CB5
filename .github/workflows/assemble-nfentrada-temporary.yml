name: Assemble NF Entrada temporary

on:
  push:
    paths:
      - 'src/staging/nfentrada/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble NF Entrada module sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, pathlib
          root = pathlib.Path('src/staging/nfentrada')
          out = pathlib.Path('src/generated/Modulos/Controle-NF-Entrada')
          out.mkdir(parents=True, exist_ok=True)
          pairs = [
              ('core.gz.b64', 'NFEntrada.Core.ps1'),
              ('module.gz.b64', 'Controle NF Entrada.ps1'),
          ]
          for src_name, dst_name in pairs:
              encoded = (root / src_name).read_text(encoding='utf-8').strip()
              raw = gzip.decompress(base64.b64decode(encoded))
              if len(raw) < 1000:
                  raise SystemExit(f'Fonte montado inesperadamente pequeno: {dst_name}')
              (out / dst_name).write_bytes(raw)
              print(f'{dst_name}: {len(raw)} bytes')
          PY
          grep -q 'function Export-NFEntradaWorkbook' 'src/generated/Modulos/Controle-NF-Entrada/NFEntrada.Core.ps1'
          grep -q 'Controle de NF de Entrada' 'src/generated/Modulos/Controle-NF-Entrada/Controle NF Entrada.ps1'
          rm -rf src/staging/nfentrada
          git config user.name "Central de Trabalho Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A src/generated/Modulos/Controle-NF-Entrada src/staging/nfentrada
          git commit -m "Adiciona módulo Controle de NF de Entrada"
          git push
