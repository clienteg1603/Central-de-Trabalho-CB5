name: NF Entrada stage 5 evolve temporary

on:
  push:
    paths:
      - 'src/current/NFENTRADA_STAGE5_READY'

permissions:
  contents: write

jobs:
  evolve:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar evolução da etapa 5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem ".\src\current\transforms\0217*.py" | Sort-Object Name | ForEach-Object {
            Write-Host "Aplicando $($_.Name)"
            python $_.FullName
          }

      - name: Validar movimentações e regressões
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & ".\src\ci\test_nfentrada_stage5.ps1" -CorePath ".\src\generated\Modulos\Controle-NF-Entrada\NFEntrada.Core.ps1"
          & ".\src\ci\parse_powershell.ps1" -Root ".\src\generated"
          python ".\src\ci\regression_contracts.py" ".\src\generated"

      - name: Publicar fontes validados
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -LiteralPath "src/current/NFENTRADA_STAGE5_READY" -Force
          Remove-Item -Path "src/current/transforms/0217*.py" -Force
          git config user.name "Central de Trabalho Builder"
          git config user.email "actions@users.noreply.github.com"
          git add 'src/generated/Modulos/Controle-NF-Entrada/NFEntrada.Core.ps1'
          git add 'src/generated/Modulos/Controle-NF-Entrada/Controle NF Entrada.ps1'
          git add 'src/generated/Central de Trabalho.ps1'
          git add 'src/ci/regression_contracts.py'
          git add 'src/ci/test_nfentrada_stage5.ps1'
          git add -u 'src/current/NFENTRADA_STAGE5_READY'
          git add -u 'src/current/transforms'
          git commit -m "Evolui Controle NF Entrada - etapa 5 movimentações"
          git push
