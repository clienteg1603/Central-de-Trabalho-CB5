name: NF output dialog regression

on:
  push:
    paths:
      - 'updates/test.json'
      - 'updates/packages/Central-de-Trabalho-v*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-output-dialog:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact published Test package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = Get-Content -LiteralPath '.\updates\test.json' -Raw | ConvertFrom-Json
          $version = [string]$channel.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Versão Teste ausente.' }
          $zip = Join-Path $PWD ("updates\packages\Central-de-Trabalho-v" + $version + ".zip")
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Pacote Teste v$version ausente." }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($hash -ne [string]$channel.PackageSha256) { throw "SHA divergente no pacote Teste v$version." }
          if (([IO.FileInfo]$zip).Length -ne [int64]$channel.PackageSize) { throw "Tamanho divergente no pacote Teste v$version." }

          $root = Join-Path $env:RUNNER_TEMP ('nf-output-published-' + [Guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $install = Join-Path $root ([string]$channel.PackageRoot)
          if (-not (Test-Path -LiteralPath $install -PathType Container)) { throw "Raiz do pacote não encontrada: $install" }

          & '.\src\ci\parse_powershell.ps1' -Root $install
          & '.\src\ci\test_nfentrada_output_dialog.ps1' -GeneratedRoot $install
          Write-Host "NF OUTPUT PACKAGE: OK — pacote Teste v$version validado exatamente como publicado."
