name: Promote runtime cores temporary

on:
  push:
    paths:
      - '.github/workflows/promote-runtime-cores-temporary.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote current runtime core sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zipfile
          package = pathlib.Path('updates/packages/Central-de-Trabalho-v0.19.6.zip')
          targets = {
              'Modulos/Central-de-Manutencao-CB5/Manutencao.Core.ps1': pathlib.Path('src/generated/Modulos/Central-de-Manutencao-CB5/Manutencao.Core.ps1'),
              'Modulos/Gerador-de-Planilhas-CB5-TV5/Componentes.Core.ps1': pathlib.Path('src/generated/Modulos/Gerador-de-Planilhas-CB5-TV5/Componentes.Core.ps1'),
          }
          with zipfile.ZipFile(package) as z:
              for suffix, target in targets.items():
                  name = next(n for n in z.namelist() if n.replace('\\','/').endswith(suffix))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
                  print('promoted', suffix, '->', target)
          PY
          git config user.name "Central de Trabalho Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/generated/Modulos/Central-de-Manutencao-CB5/Manutencao.Core.ps1 \
                  src/generated/Modulos/Gerador-de-Planilhas-CB5-TV5/Componentes.Core.ps1
          git commit -m "Versiona núcleos runtime dos módulos"
          git push
