name: Fixed theme runtime diagnostic

on:
  push:
    paths:
      - 'src/ci/test_hosted_theme_runtime.ps1'
      - 'src/generated/Central de Trabalho.ps1'
      - 'src/generated/Modulos/**'
      - 'src/current/transforms/**'
      - '.github/workflows/theme-runtime-diagnostic.yml'
  workflow_dispatch:

jobs:
  fixed-theme-runtime:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      CENTRAL_THEME_RUNTIME_TEST: '1'
      CENTRAL_THEME_TEST_DATA_ROOT: ${{ runner.temp }}\central-fixed-theme-source-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pending transforms in test workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $transforms = @(Get-ChildItem -LiteralPath 'src/current/transforms' -Filter '*.py' -File -ErrorAction SilentlyContinue | Sort-Object Name)
          foreach ($transform in $transforms) {
            Write-Host "Aplicando transform somente para diagnóstico: $($transform.FullName)"
            python $transform.FullName
            if ($LASTEXITCODE -ne 0) { throw "Transform falhou: $($transform.Name)" }
          }

      - name: Normalize runtime scripts like the real package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [Text.Encoding]::UTF8
          $utf8Bom = New-Object Text.UTF8Encoding($true)
          $files = [Collections.Generic.List[IO.FileInfo]]::new()
          foreach ($file in @(Get-ChildItem -LiteralPath 'src/generated' -Filter '*.ps1' -File -Recurse)) { $files.Add($file) }
          $files.Add((Get-Item -LiteralPath 'src/ci/test_hosted_theme_runtime.ps1'))
          foreach ($file in $files) {
            $text = [IO.File]::ReadAllText($file.FullName, $utf8)
            [IO.File]::WriteAllText($file.FullName, $text, $utf8Bom)
          }
          Write-Host "Scripts normalizados com UTF-8 BOM: $($files.Count)"

      - name: Hosted modules fixed theme runtime test
        timeout-minutes: 4
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\src\ci\test_hosted_theme_runtime.ps1' -GeneratedRoot '.\src\generated'
