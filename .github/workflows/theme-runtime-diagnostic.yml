name: Theme runtime diagnostic

on:
  push:
    paths:
      - 'src/ci/test_hosted_theme_runtime.ps1'
      - 'src/generated/Central de Trabalho.ps1'
      - 'src/generated/Modulos/**'
      - 'src/current/transforms/**'
      - '.github/workflows/theme-runtime-diagnostic.yml'
  workflow_dispatch:

jobs:
  theme-runtime:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      CENTRAL_THEME_RUNTIME_TEST: '1'
      CENTRAL_THEME_TEST_DATA_ROOT: ${{ runner.temp }}\central-theme-source-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pending transforms in test workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $transforms = @(Get-ChildItem -LiteralPath 'src/current/transforms' -Filter '*.py' -File -ErrorAction SilentlyContinue | Sort-Object Name)
          foreach ($transform in $transforms) {
            Write-Host "Aplicando transform somente para diagnóstico: $($transform.FullName)"
            python $transform.FullName
            if ($LASTEXITCODE -ne 0) { throw "Transform falhou: $($transform.Name)" }
          }

      - name: Normalize runtime scripts like the real package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [Text.Encoding]::UTF8
          $utf8Bom = New-Object Text.UTF8Encoding($true)
          $files = [Collections.Generic.List[IO.FileInfo]]::new()
          foreach ($file in @(Get-ChildItem -LiteralPath 'src/generated' -Filter '*.ps1' -File -Recurse)) { $files.Add($file) }
          $files.Add((Get-Item -LiteralPath 'src/ci/test_hosted_theme_runtime.ps1'))
          foreach ($file in $files) {
            $text = [IO.File]::ReadAllText($file.FullName, $utf8)
            [IO.File]::WriteAllText($file.FullName, $text, $utf8Bom)
          }
          Write-Host "Scripts normalizados com UTF-8 BOM: $($files.Count)"

      - name: Central plus modules theme runtime test
        timeout-minutes: 4
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'theme-source-report.json'
          $artifacts = Join-Path $env:RUNNER_TEMP 'theme-source-screenshots'
          & '.\src\generated\Central de Trabalho.ps1' -ThemeRuntimeSelfTest -ThemeRuntimeReportPath $report -ThemeRuntimeArtifactsPath $artifacts
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not [bool]$result.Success) { throw "Autoteste integrado reportou falha: $($result.Failure)" }

      - name: Hosted module theme runtime test
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\src\ci\test_hosted_theme_runtime.ps1' -GeneratedRoot '.\src\generated'

      - name: Upload source-runtime diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: central-theme-source-runtime-evidence
          path: |
            ${{ runner.temp }}/theme-source-report.json
            ${{ runner.temp }}/theme-source-screenshots
          if-no-files-found: error
          retention-days: 7
