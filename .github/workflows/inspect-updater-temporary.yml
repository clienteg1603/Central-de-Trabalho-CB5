name: Inspect updater temporary

on:
  push:
    paths:
      - '.github/workflows/inspect-updater-temporary.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect updater validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, pathlib
          package = pathlib.Path('updates/packages/Central-de-Trabalho-v0.19.4.zip')
          with zipfile.ZipFile(package) as z:
              names = z.namelist()
              root = names[0].split('/')[0]
              def read(suffix):
                  name = next(n for n in names if n.replace('\\','/').endswith(suffix))
                  return z.read(name).decode('utf-8-sig').splitlines()
              updater = read('Atualizador/Central de Trabalho Updater.ps1')
              core = read('Atualizador/Update.Core.ps1')
              def show(title, lines, lo, hi):
                  print(f'\n===== {title} lines {lo}-{hi} =====')
                  for i in range(lo-1, min(hi, len(lines))):
                      print(f'{i+1:04d}: {lines[i]}')
              show('UPDATER install flow', updater, 250, 335)
              show('UPDATER event handlers', updater, 620, 660)
              show('CORE assert install root', core, 56, 82)
              show('CORE copy directory', core, 460, 505)
              show('CORE backup', core, 500, 545)
              show('CORE install payload', core, 612, 680)
              show('CORE application locks', core, 680, 735)
          PY
