name: Inspect updater temporary

on:
  push:
    paths:
      - '.github/workflows/inspect-updater-temporary.yml'

permissions:
  contents: read

jobs:
  hidden-runtime-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce install-root validation with hidden runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD 'updates\packages\Central-de-Trabalho-v0.19.4.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'central-hidden-test'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $dest
          $root = Get-ChildItem -LiteralPath $dest -Directory | Select-Object -First 1
          if ($null -eq $root) { throw 'Package root not found' }
          $rootPath = $root.FullName
          $centralPs1 = Join-Path $rootPath 'Central de Trabalho.ps1'
          $updaterDir = Join-Path $rootPath 'Atualizador'
          $core = Join-Path $updaterDir 'Update.Core.ps1'
          Write-Host "ROOT=$rootPath"
          Write-Host "Before hide: central=$([IO.File]::Exists($centralPs1)) core=$([IO.File]::Exists($core))"
          [IO.File]::SetAttributes($centralPs1, ([IO.File]::GetAttributes($centralPs1) -bor [IO.FileAttributes]::Hidden))
          [IO.File]::SetAttributes($updaterDir, ([IO.File]::GetAttributes($updaterDir) -bor [IO.FileAttributes]::Hidden))
          Write-Host "After hide: central=$([IO.File]::Exists($centralPs1)) core=$([IO.File]::Exists($core))"
          . $core
          try {
            $validated = Assert-CentralUpdateInstallRoot -InstallRoot $rootPath
            Write-Host "ASSERT_OK=$validated"
          }
          catch {
            Write-Host "ASSERT_FAIL=$($_.Exception.Message)"
            throw
          }
