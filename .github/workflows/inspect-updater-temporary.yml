name: Inspect updater temporary

on:
  push:
    paths:
      - '.github/workflows/inspect-updater-temporary.yml'

permissions:
  contents: read

jobs:
  updater-hidden-runtime-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.19.5 transform and test hidden update plus broken-root restore
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python src/current/transforms/0195_fix_hidden_updater_rollback.py

          $work = Join-Path $env:RUNNER_TEMP 'central-updater-0195-test'
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          New-Item -ItemType Directory -Path $work | Out-Null

          $oldZip = Join-Path $work 'old.zip'
          $newZip = Join-Path $PWD 'updates\packages\Central-de-Trabalho-v0.19.4.zip'
          $env:OLD_ZIP = $oldZip
          python -c "import os,subprocess,pathlib; pathlib.Path(os.environ['OLD_ZIP']).write_bytes(subprocess.check_output(['git','show','ae5e2c8:updates/packages/Central-de-Trabalho-v0.19.3.zip']))"

          $oldExtract = Join-Path $work 'old'
          $newExtract = Join-Path $work 'new'
          Expand-Archive -LiteralPath $oldZip -DestinationPath $oldExtract
          Expand-Archive -LiteralPath $newZip -DestinationPath $newExtract
          $installRoot = (Get-ChildItem -LiteralPath $oldExtract -Directory | Select-Object -First 1).FullName
          $payloadRoot = (Get-ChildItem -LiteralPath $newExtract -Directory | Select-Object -First 1).FullName

          foreach ($path in @(
            (Join-Path $installRoot 'Central de Trabalho.ps1'),
            (Join-Path $installRoot 'PACOTE-MANIFESTO.json'),
            (Join-Path $installRoot 'Atualizador'),
            (Join-Path $installRoot 'Modulos')
          )) {
            $attr = [IO.File]::GetAttributes($path)
            [IO.File]::SetAttributes($path, ($attr -bor [IO.FileAttributes]::Hidden))
          }

          . (Join-Path $PWD 'src\generated\Atualizador\Update.Core.ps1')
          $script:CentralUpdateApplicationDataRootOverride = Join-Path $work 'localappdata'
          $script:CentralUpdateStateDirectoryOverride = Join-Path $work 'updaterstate'
          New-Item -ItemType Directory -Force -Path $script:CentralUpdateApplicationDataRootOverride | Out-Null

          $backup = Install-CentralUpdatePayload -PayloadRoot $payloadRoot -InstallRoot $installRoot -CurrentVersion '0.19.3' -TargetVersion '0.19.4'
          $installedManifest = Get-Content -LiteralPath (Join-Path $installRoot 'PACOTE-MANIFESTO.json') -Raw | ConvertFrom-Json
          if ($installedManifest.Version -ne '0.19.4') { throw "Hidden update did not reach 0.19.4" }
          Write-Host 'HIDDEN_UPDATE_OK=true'

          Clear-CentralUpdateBlockingAttributes -Path (Join-Path $installRoot 'Central de Trabalho.ps1')
          Remove-Item -LiteralPath (Join-Path $installRoot 'Central de Trabalho.ps1') -Force
          Remove-Item -LiteralPath (Join-Path $installRoot 'Atualizador\Update.Core.ps1') -Force
          if ([IO.File]::Exists((Join-Path $installRoot 'Central de Trabalho.ps1'))) { throw 'Failed to create broken install root' }

          [void](Restore-CentralUpdateBackup -Backup $backup -InstallRoot $installRoot -RestoreData)
          $restoredManifest = Get-Content -LiteralPath (Join-Path $installRoot 'PACOTE-MANIFESTO.json') -Raw | ConvertFrom-Json
          if ($restoredManifest.Version -ne '0.19.3') { throw "Rollback did not restore 0.19.3" }
          if (-not [IO.File]::Exists((Join-Path $installRoot 'Atualizador\Update.Core.ps1'))) { throw 'Rollback did not restore updater core' }
          Write-Host 'BROKEN_ROOT_ROLLBACK_OK=true'
