name: Inspect updater temporary

on:
  push:
    paths:
      - '.github/workflows/inspect-updater-temporary.yml'

permissions:
  contents: write

jobs:
  promote-updater-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote updater runtime source from validated test package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zipfile
          package = pathlib.Path('updates/packages/Central-de-Trabalho-v0.19.4.zip')
          out_dir = pathlib.Path('src/generated/Atualizador')
          out_dir.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(package) as z:
              for filename in ('Central de Trabalho Updater.ps1', 'Update.Core.ps1', 'CANAIS.json'):
                  suffix = 'Atualizador/' + filename
                  name = next(n for n in z.namelist() if n.replace('\\','/').endswith(suffix))
                  data = z.read(name)
                  (out_dir / filename).write_bytes(data)
                  print('promoted', suffix)
          PY
          git config user.name "Central de Trabalho Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/generated/Atualizador
          git commit -m "Versiona fonte atual do Atualizador para correção de recuperação"
          git push
